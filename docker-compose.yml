services:
  app:
    build: .
    volumes:
      - ./entrypoint.sh:/app/entrypoint.sh
      - ./db/seeds.rb:/app/db/seeds.rb
      - ./tmp/pids:/app/tmp/pids
    environment:
      - DATABASE_URL=postgres://postgres:decidim@db/decidim_catalunya
      - SECRET_KEY_BASE=02b1511d769fcf6aec3a816f202e524f7c0fd12080ebd3aa18cfbb141c4d1307213124e93cba1b1547c296f00c3ccaa9a5995e5b9747ba2cf91cde0fa5a44f19
      - DECIDIM_FORCE_SSL=false
      - QUEUE_ADAPTER=delayed_job
      - RUN_RAILS=true
      - RUN_WORKER=false
      # Redis is required for ActionCable (config/cable.yml), not for the queue
      - REDIS_URL=redis://redis:6379/1
    ports:
      - 3000:3000
    depends_on:
      - db
      - redis
  worker:
    build: .
    volumes:
      - ./entrypoint.sh:/app/entrypoint.sh
    environment:
      - DATABASE_URL=postgres://postgres:decidim@db/decidim_catalunya
      - SECRET_KEY_BASE=02b1511d769fcf6aec3a816f202e524f7c0fd12080ebd3aa18cfbb141c4d1307213124e93cba1b1547c296f00c3ccaa9a5995e5b9747ba2cf91cde0fa5a44f19
      - DECIDIM_FORCE_SSL=false
      - QUEUE_ADAPTER=delayed_job
      - RUN_RAILS=false
      - RUN_WORKER=true
    depends_on:
      - db
  db:
    image: postgres:18-alpine
    ports:
      - "54321:5432"
    environment:
      - POSTGRES_PASSWORD=decidim
    volumes:
      # postgres:18+ stores data under /var/lib/postgresql (version subdir); mounting the
      # old /var/lib/postgresql/data path makes the container refuse to start.
      - pg_data:/var/lib/postgresql
  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
volumes:
  pg_data:
  redis_data:
